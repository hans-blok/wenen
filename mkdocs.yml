# ============================================================
# MkDocs Configuration — Entoli 
# ============================================================

# ------------------------------------------------------------
# 1. Site Identity
# ------------------------------------------------------------
site_name: "Wenen 2026"
site_description: "Leanne en Hans in Oostenrijk"
site_author: "Hans & Leanne"
site_url: "url://localhost:8000"  # Update when publishing

# Optioneel: repository referentie
# repo_name: "entoli-startup"
# repo_url: "https://github.com/username/mandarin-startup"
# edit_uri: "edit/main/docs/"

# ------------------------------------------------------------
# 2. Documentation Source
# ------------------------------------------------------------
docs_dir: "artefacten"
site_dir: "site"

# ------------------------------------------------------------
# 3. Theme & Presentation
# Entoli house style with Material theme
# ------------------------------------------------------------
theme:
  name: "material"
  language: "en"
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    primary: "red"
    accent: "red"
  font:
    text: "Segoe UI"
    code: "Consolas"
  icon:
    logo: material/train

# ------------------------------------------------------------
# 4. Custom Styling - Entoli Stylesheet
# Owner: Presentation Architect
# ------------------------------------------------------------
extra_css: []

extra_javascript: []

# ------------------------------------------------------------
# 5. Plugins
# ------------------------------------------------------------
plugins:
  - search:
      lang: en

# ------------------------------------------------------------
# 6. Markdown Extensions
# ------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------
# 7. Navigation Structure
# Primary responsibility: Publication Steward
# ------------------------------------------------------------
nav:
  - Home: index.md
  - Sightseeing overzicht: 00-sightseeing-overzicht.md
  - Planning:
    - Vrijdag 29 mei - Treinreis: 01-vrijdag.md
    - Zaterdag 30 mei - Belvedere & Binnenstad: 02-zaterdag.md
    - Zondag 31 mei - Graz & Renske: 03-zondag.md
    - Maandag 1 juni - Schönbrunn & Prater: 04-maandag.md
    - Dinsdag 2 juni - Terugreis: 05-dinsdag.md

# ------------------------------------------------------------
# 8. Extra Configuration
# ------------------------------------------------------------
extra:
  social: []
  generator: false  # Verberg "Made with Material for MkDocs"

# ------------------------------------------------------------
# 9. Copyright
# ------------------------------------------------------------
copyright: "Open Source © 2026 Hans & Leanne"

